<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="Arc-V 유희왕 내전">
<meta property="og:description" content="대진표 만들고 다 같이 승패 기록하기">
<title>Arc-V 유희왕 내전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&family=Russo+One&display=swap">
<style>
/* Layout: 펜듈럼 소환진 히어로 → 대회 화면은 상단 바 + 탭(대진표 / 순위표 / 결과 매트릭스) */
:root{
  --night:#0b0a1f; --deep:#15123a; --panel:#1c1847; --line:#3a3478;
  --ink:#f3f0ff; --dim:#a9a3d6;
  --gold:#ffcf4a; --pend-r:#ff4f8b; --pend-b:#3fd0ff; --win:#3ee8a4; --lose:#ff6b7d;
  --f-display:"Black Han Sans","Gothic A1",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-latin:"Russo One","Gothic A1",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:#0b0a1f}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;min-height:100%;
  background-image:radial-gradient(ellipse 80% 50% at 15% 0%,rgba(255,79,139,.18),transparent 60%),radial-gradient(ellipse 80% 50% at 85% 0%,rgba(63,208,255,.18),transparent 60%),radial-gradient(ellipse 120% 60% at 50% 110%,rgba(255,207,74,.10),transparent 60%);
  background-attachment:fixed}
.wrap{max-width:1120px;margin:0 auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* HERO */
.hero{position:relative;display:grid;justify-items:center;text-align:center;padding-block:28px 8px;overflow:hidden}
.circle{position:absolute;top:10px;left:50%;width:min(560px,120vw);aspect-ratio:1;max-width:none;transform:translateX(-50%);opacity:.5;pointer-events:none}
.circle svg{width:100%;height:100%;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:relative;width:min(220px,52vw);aspect-ratio:1;border-radius:22px;padding:6px;
  background:linear-gradient(135deg,var(--pend-r),var(--gold) 45%,var(--pend-b));box-shadow:0 0 40px rgba(255,207,74,.35),0 20px 50px rgba(0,0,0,.5);
  animation:float 5s ease-in-out infinite}
.card img{display:block;width:100%;height:100%;object-fit:cover;border-radius:17px}
.card::after{content:"";position:absolute;inset:6px;border-radius:17px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);background-size:250% 100%;animation:holo 4s ease-in-out infinite;mix-blend-mode:overlay}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes holo{0%{background-position:120% 0}100%{background-position:-120% 0}}
.eyebrow{margin-top:22px;font-family:var(--f-latin);letter-spacing:.32em;font-size:13px;color:var(--gold)}
h1.title{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(44px,10vw,96px);line-height:1;text-wrap:balance;
  background:linear-gradient(90deg,var(--pend-r),#fff 35%,#fff 65%,var(--pend-b));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,79,139,.35))}
h1.title .arc{font-family:var(--f-latin);letter-spacing:-.02em}
.tag{margin-top:8px;color:var(--dim)}

/* PANELS */
.panel{background:linear-gradient(180deg,rgba(28,24,71,.92),rgba(21,18,58,.92));border:1px solid var(--line);border-radius:18px;padding:22px}
h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 14px;letter-spacing:.01em}
.home{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:28px}
@media (max-width:820px){.home{grid-template-columns:1fr}}
label.lbl{display:block;font-size:12px;letter-spacing:.12em;color:var(--dim);margin:14px 0 6px;font-weight:800}
input[type=text]{width:100%;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=text]:focus{border-color:var(--gold);outline:none}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.seg{grid-template-columns:1fr}}
textarea{width:100%;min-height:190px;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;line-height:1.8;resize:vertical}
textarea:focus{border-color:var(--gold);outline:none}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.parsed{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--night);border:1px solid var(--line)}
.parsed.ok{border-color:rgba(62,232,164,.5);color:var(--win)}
.parsed.bad{border-color:rgba(255,107,125,.5);color:var(--lose)}
.parsed .who{color:var(--ink)}
.seg button{background:var(--night);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.seg button b{display:block;font-size:16px}
.seg button span{font-size:12px;color:var(--dim)}
.seg button[aria-pressed=true]{border-color:var(--gold);background:rgba(255,207,74,.1);box-shadow:inset 0 0 0 1px var(--gold)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--night);font-size:20px}
.stepper output{font-family:var(--f-latin);font-size:24px;min-width:40px;text-align:center}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.names .nm{display:flex;align-items:center;gap:6px}
.names .dot{flex:none;width:10px;height:10px;border-radius:50%}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--dim);font-size:14px}
.go{margin-top:20px;width:100%;border:0;border-radius:14px;padding:16px;font-family:var(--f-display);font-size:22px;color:#1a1030;
  background:linear-gradient(90deg,var(--pend-r),var(--gold),var(--pend-b));box-shadow:0 8px 30px rgba(255,207,74,.3);transition:transform .15s}
.go:hover{transform:translateY(-2px)}
.go:disabled{opacity:.5;transform:none}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--night);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.item:hover{border-color:var(--gold)}
.item b{display:block}
.item small{color:var(--dim)}
.pill{flex:none;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;border:1px solid currentColor}
.pill.lg{color:var(--pend-b)} .pill.ko{color:var(--pend-r)} .pill.done{color:var(--gold)}
.empty{color:var(--dim);font-size:14px;padding:18px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.notice{margin-top:14px;font-size:13px;color:var(--dim);border-left:3px solid var(--gold);padding:6px 10px}

/* TOURNAMENT VIEW */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:18px}
.bar .mini{width:56px;height:56px;border-radius:12px;padding:3px;background:linear-gradient(135deg,var(--pend-r),var(--gold),var(--pend-b))}
.bar .mini img{width:100%;height:100%;border-radius:9px;object-fit:cover;display:block}
.bar .tt{flex:1;min-width:0}
.bar .tt small{color:var(--gold);font-family:var(--f-latin);letter-spacing:.2em;font-size:11px}
.bar .tt h2{margin:0;font-size:clamp(24px,5vw,34px);overflow-wrap:anywhere}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.ghost:hover{border-color:var(--gold)}
.ghost.danger{color:var(--lose)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0;color:var(--dim);font-size:14px}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:9px;background:var(--panel);overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pend-r),var(--gold),var(--pend-b));transition:width .4s}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--deep);border-radius:99px;padding:9px 16px;font-weight:800}
.tabs button[aria-selected=true]{background:var(--gold);color:#1a1030;border-color:var(--gold)}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--dim)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dim)}
.live.on{color:var(--win)}.live.on::before{background:var(--win);box-shadow:0 0 8px var(--win)}
.share{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--dim);margin-bottom:14px}

.rounds{display:grid;gap:14px}
.round{background:rgba(28,24,71,.7);border:1px solid var(--line);border-radius:16px;padding:14px}
.round h3{margin:0 0 10px;font-family:var(--f-latin);font-weight:400;font-size:15px;letter-spacing:.14em;color:var(--gold);display:flex;gap:10px;align-items:center}
.round h3 small{font-family:var(--f-body);letter-spacing:0;color:var(--dim);font-size:12px}
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--night);border:1px solid var(--line);border-radius:12px;padding:8px}
.match.done{border-color:rgba(255,207,74,.45)}
.vs{font-family:var(--f-latin);font-size:13px;color:var(--dim)}
.pl{position:relative;border:0;border-radius:9px;padding:11px 8px;font-weight:800;font-size:15px;color:#fff;background:var(--c);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:filter .15s,opacity .15s,transform .15s;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.12)}
.pl:disabled{cursor:default}
.pl.lost{opacity:.32;filter:grayscale(.7)}
.pl.won{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(255,207,74,.55)}
.pl.won::after{content:"WIN";position:absolute;top:2px;right:5px;font-family:var(--f-latin);font-size:9px;color:var(--gold);text-shadow:0 1px 2px #000}
.pl.tbd{background:var(--panel);color:var(--dim);font-weight:600}
.pl.bye{background:transparent;border:1px dashed var(--line);color:var(--dim);font-weight:600}
.hint{font-size:13px;color:var(--dim);margin:-4px 0 12px}

/* bracket */
.bracket{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:18px;overflow-x:auto;padding-bottom:8px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.bcol h3{margin:0;font-family:var(--f-latin);font-weight:400;font-size:13px;letter-spacing:.14em;color:var(--gold);text-align:center}
.bmatch{display:grid;gap:4px;background:var(--night);border:1px solid var(--line);border-radius:12px;padding:6px}
.bmatch .pl{text-align:left}
.champ{margin-top:16px;display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;background:linear-gradient(90deg,rgba(255,79,139,.2),rgba(255,207,74,.25),rgba(63,208,255,.2));border:1px solid var(--gold)}
.champ .crown{font-family:var(--f-latin);color:var(--gold);font-size:12px;letter-spacing:.24em}
.champ b{font-family:var(--f-display);font-size:34px;font-weight:400}

/* tables */
.tblwrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:11px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:var(--panel);font-size:13px;color:var(--dim);font-weight:800}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
td.name,th.name{text-align:left;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:8px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.rank{font-family:var(--f-latin);font-size:18px}
tr.r1 .rank{color:var(--gold)} tr.r2 .rank{color:#d7e1ff} tr.r3 .rank{color:#ffad7a}
tr.r1{background:rgba(255,207,74,.08)}
.mx td{min-width:62px}
.mx td.self{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(169,163,214,.12) 6px 8px)}
.w{color:var(--win);font-weight:800}.l{color:var(--lose);font-weight:800}.n{color:var(--line)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px;align-items:end}
.pod{text-align:center;border-radius:14px;padding:14px 8px;background:var(--panel);border:1px solid var(--line);min-width:0}
.pod .rank{display:block}
.pod b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{color:var(--dim)}
.pod.p1{border-color:var(--gold);padding-block:24px;box-shadow:0 0 30px rgba(255,207,74,.2)}
.pod.p1 .rank{color:var(--gold)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--night);font-weight:800;padding:10px 16px;border-radius:99px;transition:.25s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.burst{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function parseCustom(text){
  const lines=text.split(/\n/).map(s=>s.trim()).filter(Boolean);

  const idx=nm=>{let i=players.indexOf(nm);if(i<0){players.push(nm);i=players.length-1}return i};

      if(ab.length!==2){errs.push(`${li+1}번째 줄 "${m}" → "이름 vs 이름" 모양으로 적어주세요`);return}
      if(ab[0]===ab[1]){errs.push(`${li+1}번째 줄 "${m}" → 같은 사람끼리는 붙을 수 없어요`);return}
      sched.push({r:li,a:idx(ab[0].slice(0,12)),b:idx(ab[1].slice(0,12))});
    });
  });
  if(!errs.length&&players.length<2)errs.push("대진을 한 줄 이상 적어주세요");
  if(players.length>16)errs.push("참가자는 16명까지 돼요");
  return{players,sched,rounds:lines.length,errs};
}

/* ---------- 리그전: 원형 방식 라운드 로빈 ---------- */
function leagueRounds(n){
  const ids=[...Array(n).keys()]; if(n%2) ids.push(-1);
  const m=ids.length, rounds=[];
  let arr=ids.slice();
  for(let r=0;r<m-1;r++){
    const games=[];
    for(let i=0;i<m/2;i++){const a=arr[i],b=arr[m-1-i]; if(a<0||b<0) continue; games.push([a,b])}
    rounds.push(games);
    arr=[arr[0],arr[m-1],...arr.slice(1,m-1)];
  }
  return rounds;
}
const lkey=(a,b)=>Math.min(a,b)+"-"+Math.max(a,b);

/* ---------- 토너먼트: 시드 배치 + 부전승 ---------- */
function seedOrder(P){let a=[1];while(a.length<P){const L=a.length*2,nx=[];for(const s of a)nx.push(s,L+1-s);a=nx}return a}
function bracket(n,res){
  let P=1;while(P<n)P*=2;
  const R=Math.log2(P), order=seedOrder(P), rounds=[];
  let slots=order.map(s=>s-1<n?s-1:-1);         // -1 = 부전승 자리
  for(let r=0;r<R;r++){
    const ms=[],next=[];
    for(let j=0;j<slots.length/2;j++){
      const a=slots[2*j],b=slots[2*j+1],key="b"+r+"-"+j;
      let w=null,auto=false;
      if(a===-1&&b===-1){w=-1;auto=true}
      else if(a===-1&&b!=null){w=b;auto=true}
      else if(b===-1&&a!=null){w=a;auto=true}
      else if(a!=null&&b!=null){const v=res[key];if(v===a||v===b)w=v}
      ms.push({a,b,key,w,auto});next.push(w);
    }
    rounds.push(ms);slots=next;
  }
  return {rounds,R,champ:slots[0]!=null&&slots[0]>=0?slots[0]:null};
}
function roundName(r,R){const left=R-r;return left===1?"FINAL":left===2?"SEMI-FINAL":"ROUND OF "+(2**left)}
function roundKo(r,R){const left=R-r;return left===1?"결승":left===2?"준결승":(2**left)+"강"}

/* ---------- 집계 ---------- */
function compute(t){
  const n=t.players.length,res=t.results||{},games=[],st=t.players.map((p,i)=>({i,w:0,l:0}));
  const h2h={};
  let view;
  if(t.mode==="league"){
    view=leagueRounds(n).map(gs=>gs.map(([a,b])=>{const k=lkey(a,b),v=res[k];return{a,b,key:k,w:(v===a||v===b)?v:null}}));
    view.forEach(gs=>gs.forEach(g=>games.push(g)));
  }else if(t.mode==="custom"){
    view=[];const cnt={};
    (t.schedule||[]).forEach(s=>{(view[s.r]||(view[s.r]=[]));const j=cnt[s.r]=(cnt[s.r]||0);cnt[s.r]++;const k="c"+s.r+"-"+j,v=res[k];view[s.r].push({a:s.a,b:s.b,key:k,w:(v===s.a||v===s.b)?v:null})});
    view=view.filter(Boolean);
    view.forEach(gs=>gs.forEach(g=>games.push(g)));
  }else{
    view=bracket(n,res);
    view.rounds.forEach(ms=>ms.forEach(m=>{if(!m.auto&&m.a!=null&&m.b!=null&&m.a>=0&&m.b>=0)games.push(m)}));
  }
  const per=t.players.map(()=>0);games.forEach(g=>{per[g.a]++;per[g.b]++});
  for(const g of games){if(g.w==null)continue;const lo=g.w===g.a?g.b:g.a;st[g.w].w++;st[lo].l++;h2h[g.w+">"+lo]=(h2h[g.w+">"+lo]||0)+1}
  const done=games.filter(g=>g.w!=null).length;
  let ranks;
  if(t.mode!=="ko"){
    ranks=st.map(s=>({...s,pts:s.w,rank:1+st.filter(o=>o.w>s.w).length}));
    ranks.sort((x,y)=>x.rank-y.rank||y.w-x.w||x.l-y.l);
  }else{
    const R=view.R;const elim={};
    view.rounds.forEach((ms,r)=>ms.forEach(m=>{if(m.w!=null&&m.w>=0&&!m.auto){const lo=m.w===m.a?m.b:m.a;elim[lo]=r}}));
    ranks=st.map(s=>{let rank=null;if(view.champ===s.i)rank=1;else if(elim[s.i]!=null)rank=2**(R-1-elim[s.i])+1;return{...s,pts:s.w,rank}});
    ranks.sort((x,y)=>(x.rank??1e9)-(y.rank??1e9)||y.w-x.w);
  }
  return{view,games,done,total:games.length,ranks,h2h,per};
}

  ${body}`;
  $("#home").onclick=goHome;
  $("#tab-games").onclick=()=>{tab="games";render()};
  $("#tab-rank").onclick=()=>{tab="rank";render()};
  $("#tab-mx").onclick=()=>{tab="mx";render()};
  $("#copy").onclick=copyInfo;
  $("#del").onclick=delT;
  v.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>record(b.dataset.k,+b.dataset.p));
}
function pbtn(i,P,g){
  if(i===-1)return`<button class="pl bye" disabled>부전승</button>`;
  if(i==null)return`<button class="pl tbd" disabled>대기 중</button>`;
  const cls=g.w==null?"":g.w===i?"won":"lost";
  return`<button class="pl ${cls}" style="--c:${COLORS[i%16]}" data-k="${g.key}" data-p="${i}" ${canWrite?"":"disabled"} aria-label="${esc(P[i])} 승리로 기록">${esc(P[i])}</button>`;
}
function gamesLeague(c,P){
  return`<p class="hint">이긴 사람 이름을 누르면 기록돼요. 같은 이름을 다시 누르면 취소, 상대를 누르면 바뀌어요.</p>
  <div class="rounds">${c.view.map((gs,r)=>`<section class="round"><h3>ROUND ${r+1}<small>${gs.filter(g=>g.w!=null).length}/${gs.length} 완료</small></h3>
  <div class="matches">${gs.map(g=>`<div class="match ${g.w!=null?"done":""}">${pbtn(g.a,P,g)}<span class="vs">VS</span>${pbtn(g.b,P,g)}</div>`).join("")}</div></section>`).join("")}</div>`;
}
function gamesKo(c,P){
  const{rounds,R}=c.view;
  return`<p class="hint">이긴 사람을 누르면 다음 라운드로 올라가요. 앞 경기 결과를 바꾸면 뒤 경기는 다시 기록해야 해요.</p>
  <div class="bracket">${rounds.map((ms,r)=>`<div class="bcol"><h3>${roundName(r,R)}</h3>${ms.map(m=>`<div class="bmatch">${pbtn(m.a,P,m)}${pbtn(m.b,P,m)}</div>`).join("")}</div>`).join("")}</div>`;
}
function rankTable(t,c,P){
  const top=c.ranks.filter(r=>r.rank!=null&&r.rank<=3).slice(0,3);
  const lg=t.mode!=="ko";
  const pod=top.length&&c.done?`<div class="podium">${[top[1],top[0],top[2]].map(r=>r?`<div class="pod p${r.rank}"><span class="rank">${r.rank}위</span><b>${esc(P[r.i])}</b><small>${r.w}승 ${r.l}패</small></div>`:`<div></div>`).join("")}</div>`:"";
  return`${pod}<div class="tblwrap"><table><thead><tr><th>순위</th><th class="name">이름</th><th>경기</th><th>승</th><th>패</th>${lg?"<th>승점</th>":"<th>도달</th>"}</tr></thead><tbody>
  ${c.ranks.map(r=>`<tr class="${r.rank&&r.rank<=3?"r"+r.rank:""}"><td class="rank">${r.rank??"–"}</td><td class="name"><span class="chip" style="--c:${COLORS[r.i%16]}"><i></i>${esc(P[r.i])}</span></td><td>${r.w+r.l}${lg?"/"+c.per[r.i]:""}</td><td class="w">${r.w}</td><td class="l">${r.l}</td><td>${lg?r.pts:koReach(r,c)}</td></tr>`).join("")}
  </tbody></table></div><p class="hint" style="margin-top:10px">${lg?"승점이 같으면 공동 순위로 표기해요.":"같은 라운드에서 떨어진 사람은 공동 순위예요."}</p>`;
}
function koReach(r,c){if(r.rank===1)return"우승";if(r.rank==null)return"진행 중";const R=c.view.R;const lostRound=R-1-Math.log2(r.rank-1);return roundKo(lostRound,R)}
function matrix(c,P){
  const cell=(i,j)=>{if(i===j)return`<td class="self" aria-label="본인"></td>`;const a=c.h2h[i+">"+j]||0,b=c.h2h[j+">"+i]||0;
    if(!a&&!b)return`<td class="n">·</td>`;return`<td>${a?`<span class="w">승</span>`:""}${a&&b?" ":""}${b?`<span class="l">패</span>`:""}</td>`};
  return`<p class="hint">가로줄 사람 기준 결과예요. 예) 첫 줄의 "승"은 그 사람이 세로줄 상대를 이겼다는 뜻.</p>
  <div class="tblwrap"><table class="mx"><thead><tr><th></th>${P.map((p,j)=>`<th><span class="chip" style="--c:${COLORS[j%16]}"><i></i>${esc(p)}</span></th>`).join("")}</tr></thead><tbody>
  ${P.map((p,i)=>`<tr><th class="name"><span class="chip" style="--c:${COLORS[i%16]}"><i></i>${esc(p)}</span></th>${P.map((_,j)=>cell(i,j)).join("")}</tr>`).join("")}</tbody></table></div>`;
}

/* ---------- 동작 ---------- */
function modeName(m){return m==="league"?"리그전":m==="custom"?"직접 입력":"토너먼트"}
async function create(){
  if(!db)return;
  if(form.mode==="custom"){
    const p=parseCustom(form.text);
    if(p.errs.length){toast(p.errs[0]);return}
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    $("#create").disabled=true;
    try{await store.create(id,{name:form.name.trim()||"Arc-V 유희왕 내전",mode:"custom",players:p.players,schedule:p.sched,createdAt:Date.now()});
      form.name="";location.hash="t-"+id;toast("내전이 열렸어요! 주소를 공유하세요")}
    catch(e){failed(e);$("#create").disabled=false}
    return;
  }
  const names=form.names.slice(0,form.n).map((s,i)=>s.trim()||(i+1)+"번");
  if(new Set(names).size!==names.length){toast("이름이 겹쳐요. 다르게 적어주세요");return}
  let players=names.slice();
  if(form.mode==="ko"&&form.shuffle){for(let i=players.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[players[i],players[j]]=[players[j],players[i]]}}
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const name=form.name.trim()||"Arc-V 유희왕 내전";
  $("#create").disabled=true;
  try{await store.create(id,{name,mode:form.mode,players,createdAt:Date.now()});
    form.name="";location.hash="t-"+id;toast("내전이 열렸어요! 주소를 공유하세요")}
  catch(e){failed(e);$("#create").disabled=false}
}
function record(key,p){
  if(!cur||!db)return;
  const old=(cur.results||{})[key];
  const val=old===p?null:p;
  const before=compute(cur);
  cur={...cur,results:{...(cur.results||{}),[key]:val}};
  const after=compute(cur);
  render();
  if(val!=null)toast(`${cur.players[p]} 승리 기록!`);
  const champNow=cur.mode==="ko"?after.view.champ!=null&&before.view.champ==null:after.total&&after.done===after.total&&before.done!==before.total;
  if(champNow)burst();
  store.setResult(curId,key,val).catch(failed);
}
function failed(){toast("저장에 실패했어요. 인터넷 연결을 확인하고 다시 눌러주세요")}
async function delT(){
  if(!confirmDel){confirmDel=true;render();setTimeout(()=>{confirmDel=false;if(curId)render()},4000);return}
  try{await store.remove(curId,cur);toast("삭제했어요");goHome()}catch(e){failed(e)}
}
function copyInfo(){
  const url=location.href;
  const fb=()=>{const i=document.createElement("input");i.value=url;document.body.append(i);i.select();try{document.execCommand("copy");toast("링크를 복사했어요")}catch(_){toast(url)}i.remove()};
  if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast("링크를 복사했어요. 단톡방에 붙여넣으세요"),fb);else fb();
}
function goHome(){location.hash="";if(location.hash)location.hash=""}

function route(){
  const m=location.hash.match(/^#t-([a-z0-9]+)$/);
  const id=m?m[1]:null;
  if(id===curId){render();return}
  if(unsubDoc){unsubDoc();unsubDoc=null}
  curId=id;cur=null;tab="games";confirmDel=false;
  if(id)watchDoc();
  render();window.scrollTo(0,0);
}
function watchDoc(){
  const id=curId;
  unsubDoc=store.watch(id,t=>{if(id!==curId)return;cur=t;render()},()=>{if(id===curId){toast("없거나 삭제된 내전이에요");goHome()}});
}

/* ---------- 실시간 저장소: 공개 MQTT 브로커의 보관(retained) 메시지 ---------- */
const BASE="arcv-duel-6f2q9x/v1/";
const store={
  c:null,metas:{},cache:{},watchers:{},
  connect(){
    const c=this.c=mqtt.connect("wss://broker.emqx.io:8084/mqtt",{clientId:"arcv_"+Math.random().toString(36).slice(2,10),reconnectPeriod:2000,connectTimeout:8000,clean:true});
    c.on("connect",()=>{db=store;dbReady=true;c.subscribe(BASE+"idx/+",{qos:1});Object.keys(this.watchers).forEach(id=>c.subscribe(BASE+"t/"+id+"/#",{qos:1}));render()});
    c.on("close",()=>{if(db){db=null;render()}});
    c.on("message",(topic,buf)=>this.onMsg(topic.slice(BASE.length),buf.toString()));
  },
  onMsg(path,s){
    const p=path.split("/");let v=null;
    if(s){try{v=JSON.parse(s)}catch(e){return}}
    if(p[0]==="idx"){if(v&&v.name)this.metas[p[1]]={id:p[1],...v};else delete this.metas[p[1]];
      list=Object.values(this.metas).sort((a,b)=>b.createdAt-a.createdAt).slice(0,30);if(!curId)schedule();return}
    if(p[0]!=="t")return;
    const id=p[1],e=this.entry(id);
    if(p[2]==="meta"){if(v&&v.name){e.meta=v;e.seen=true}else{e.meta=null;e.gone=true}}
    else if(p[2]==="r"){if(v==null)delete e.results[p[3]];else e.results[p[3]]=v}
    this.emit(id);
  },
  entry(id){return this.cache[id]||(this.cache[id]={meta:null,results:{}})},
  emit(id){
    const e=this.cache[id],w=this.watchers[id];if(!w)return;
    if(e.gone&&!e.meta){w.gone();return}
    if(!e.meta)return;
    const t={id,...e.meta,results:{...e.results}};
    try{localStorage.setItem("arcv:"+id,JSON.stringify(t))}catch(_){}
    w.next(t);
  },
  watch(id,next,gone){
    this.watchers[id]={next,gone};
    const e=this.entry(id);
    // 이 브라우저에 남아있는 사본으로 먼저 보여주기
    if(!e.meta){try{const l=JSON.parse(localStorage.getItem("arcv:"+id)||"null");if(l){const{results,id:_,...m}=l;e.meta=m;e.results={...results,...e.results};e.local=true}}catch(_){}}
    if(e.meta)setTimeout(()=>this.emit(id));
    if(this.c&&this.c.connected)this.c.subscribe(BASE+"t/"+id+"/#",{qos:1});
    // 서버에 기록이 사라졌으면 내 사본으로 복구
    const heal=setTimeout(()=>{if(this.watchers[id]&&this.c&&this.c.connected&&!e.seen&&!e.gone&&e.local){this.create(id,e.meta);Object.entries(e.results).forEach(([k,v])=>this.setResult(id,k,v))}},6000);
    return()=>{clearTimeout(heal);delete this.watchers[id];if(this.c)this.c.unsubscribe(BASE+"t/"+id+"/#")};
  },
  pub(path,val){return new Promise((ok,no)=>{if(!this.c||!this.c.connected)return no(new Error("offline"));this.c.publish(BASE+path,val==null?"":JSON.stringify(val),{qos:1,retain:true},err=>err?no(err):ok())})},
  async create(id,meta){
    const e=this.entry(id);e.meta=meta;e.seen=true;e.gone=false;
    await this.pub("t/"+id+"/meta",meta);
    await this.pub("idx/"+id,{name:meta.name,mode:meta.mode,players:meta.players,createdAt:meta.createdAt});
  },
  setResult(id,key,val){const e=this.entry(id);if(val==null)delete e.results[key];else e.results[key]=val;return this.pub("t/"+id+"/r/"+key,val)},
  async remove(id,t){
    for(const k of Object.keys((t&&t.results)||{}))await this.pub("t/"+id+"/r/"+k,null);
    await this.pub("t/"+id+"/meta",null);await this.pub("idx/"+id,null);
    try{localStorage.removeItem("arcv:"+id)}catch(_){}
  }
};
let rq=0;function schedule(){if(!rq)rq=setTimeout(()=>{rq=0;render()},30)}

/* 우승 축하 효과 */
function burst(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("#burst"),x=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#ffcf4a","#ff4f8b","#3fd0ff","#ffffff"];
  const ps=Array.from({length:160},()=>({x:cv.width/2,y:cv.height*.4,vx:(Math.random()-.5)*14,vy:Math.random()*-14-2,s:Math.random()*6+3,c:cols[Math.random()*4|0],r:Math.random()*6}));
  let f=0;(function step(){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<120)requestAnimationFrame(step);else x.clearRect(0,0,cv.width,cv.height)})();
}

addEventListener("hashchange",route);
if(window.mqtt)store.connect();else toast("기록 서버 라이브러리를 못 불러왔어요. 새로고침해 주세요");
route();
</script>
